<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Visualizer – Mô phỏng thuật toán từng bước</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#14213d;--mute:#5b6b85;--line:#d3dbe8;--bar:#b4c2db;--cmp:#2f6fed;--swp:#f2a31b;--piv:#8b5cf6;--ok:#1fa971;--grid:#e3e9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--panel:#172238;--ink:#e6ecf7;--mute:#93a3bf;--line:#2a3956;--bar:#44567a;--cmp:#5b93ff;--swp:#f5b83d;--piv:#a78bfa;--ok:#34c68a;--grid:#1f2c46}}
:root[data-theme="dark"]{--bg:#0f1726;--panel:#172238;--ink:#e6ecf7;--mute:#93a3bf;--line:#2a3956;--bar:#44567a;--cmp:#5b93ff;--swp:#f5b83d;--piv:#a78bfa;--ok:#34c68a;--grid:#1f2c46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:24px 16px}
nav{display:flex;flex-direction:column;border-left:2px solid var(--line);align-self:start;position:sticky;top:16px}
nav button{all:unset;cursor:pointer;padding:9px 14px;margin-left:-2px;border-left:2px solid transparent;color:var(--mute);font-size:15px}
nav button:hover{color:var(--ink)}
nav button.on{border-left-color:var(--cmp);color:var(--ink);font-weight:700}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--cmp);outline-offset:2px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.desc{margin:0 0 6px;color:var(--mute);max-width:70ch}
.cx{font-size:13px;color:var(--mute);margin:0 0 16px}.cx b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.row label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
input[type=text],input[type=number]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
input[type=text]{width:190px}input[type=number]{width:70px}
.btn{font:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--cmp)}
.btn.main{background:var(--cmp);border-color:var(--cmp);color:#fff;min-width:96px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.bars{position:relative;height:240px;--n:10;--dur:260ms}
.idx{display:flex;gap:5px;margin-top:4px}.idx span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--mute);min-height:16px;white-space:nowrap}
.col{position:absolute;bottom:0;height:100%;left:calc(var(--p)*(100% + 5px)/var(--n));width:calc((100% + 5px)/var(--n) - 5px);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;transition:left var(--dur) ease,opacity .2s}
.v{font-size:12px;font-weight:700;margin-bottom:3px}
.dense .v{font-size:10px}
.bar{width:100%;background:var(--bar);border-radius:4px 4px 0 0;transition:height var(--dur) ease,background .15s}
.col.cmp .bar{background:var(--cmp)}.col.swp .bar{background:var(--swp)}.col.piv .bar{background:var(--piv)}
.col.ok .bar{background:var(--ok)}.col.fnd .bar{background:var(--ok);outline:3px solid var(--ok);outline-offset:2px}
.col.fade,.col.miss{opacity:.3}
#ex{display:flex;flex-wrap:wrap;gap:12px 20px;margin-bottom:14px}
.grp b{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-bottom:3px}
.cells{display:flex;gap:3px;flex-wrap:wrap}
.cell{min-width:32px;padding:3px 6px;text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:13px;font-weight:700}
.cell i{display:block;font-style:normal;font-size:10px;font-weight:400;color:var(--mute)}
.cell.cmp{border-color:var(--cmp);background:var(--cmp);color:#fff}.cell.cmp i{color:#fff}
.cell.swp{border-color:var(--swp);background:var(--swp);color:#14213d}.cell.swp i{color:#14213d}
.cell.dim{opacity:.35}
.msg{margin:12px 0 0;padding:10px 14px;border-radius:8px;background:var(--bg);font-size:15px;min-height:46px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 10px}
.ctl input[type=range]{accent-color:var(--cmp)}
#pos{flex:1;min-width:140px}
.cnt{font-size:13px;color:var(--mute);min-width:84px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.hide{display:none!important}
@media (max-width:760px){
 .app{grid-template-columns:minmax(0,1fr);gap:12px}
 nav{flex-direction:row;overflow-x:auto;border-left:0;border-bottom:2px solid var(--line);position:static}
 nav button{margin:0 0 -2px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
 nav button.on{border-bottom-color:var(--cmp)}
 .bars{height:190px}h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.bar,.col{transition:none}}
</style>
</head>
<body>
<div class="app">
<nav id="nav" aria-label="Danh sách thuật toán"></nav>
<main>
 <h1 id="title"></h1>
 <p class="desc" id="desc"></p>
 <p class="cx" id="cx"></p>
 <div class="row">
  <label>Số phần tử <input type="range" id="size" min="5" max="20" value="10"><span id="sizev">10</span></label>
  <button class="btn" id="gen">Tạo mảng mới</button>
  <input type="text" id="custom" placeholder="Nhập mảng: 5, 3, 8, 1" aria-label="Mảng tự nhập">
  <button class="btn" id="apply">Dùng mảng này</button>
  <label id="tgl" class="hide">Cần tìm <input type="number" id="tgt" min="0" max="999"></label>
 </div>
 <p class="cx" id="note"></p>
 <section class="stage">
  <div id="ex"></div>
  <div class="bars" id="bars"></div>
  <div class="idx" id="idx"></div>
  <p class="msg" id="msg" aria-live="polite"></p>
 </section>
 <div class="ctl">
  <button class="btn" id="first" title="Về đầu">⏮</button>
  <button class="btn" id="prev">Bước trước</button>
  <button class="btn main" id="play">Chạy</button>
  <button class="btn" id="next">Bước sau</button>
  <span class="cnt" id="cnt"></span>
  <label class="row" style="margin:0">Tốc độ <input type="range" id="spd" min="1" max="10" value="6"></label>
 </div>
 <div class="ctl" style="margin-top:0"><input type="range" id="pos" min="0" max="0" value="0" aria-label="Chọn bước"></div>
 <div class="legend" id="legend"></div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let S=[],cur=0,key='bubble',arr=[],T=0,playing=false,timer=null,base={},cols=[],MX=1;
const P=(a,msg,over={},o={})=>S.push({a:a.slice(),cls:{...base,...over},msg,...o});
const ok=i=>{base[i]='ok'};
const sw=(a,i,j)=>{[a[i],a[j]]=[a[j],a[i]]};
const fin=(a,m)=>{a.forEach((_,i)=>ok(i));P(a,m||'Hoàn thành: mảng đã được sắp xếp.')};

function bubble(a){const n=a.length;P(a,'Bắt đầu: so sánh từng cặp phần tử kề nhau.');
 for(let i=0;i<n-1;i++){let s=false;
  for(let j=0;j<n-1-i;j++){
   P(a,`So sánh ${a[j]} và ${a[j+1]}.`,{[j]:'cmp',[j+1]:'cmp'});
   if(a[j]>a[j+1]){sw(a,j,j+1);s=true;P(a,`${a[j+1]} lớn hơn ${a[j]} nên hai phần tử đổi chỗ.`,{[j]:'swp',[j+1]:'swp'})}
  }
  ok(n-1-i);P(a,`Phần tử ${a[n-1-i]} đã về đúng vị trí.`);
  if(!s){P(a,'Lượt này không đổi chỗ lần nào, mảng đã xong nên dừng sớm.');break}
 }
 fin(a)}

function selection(a){const n=a.length;P(a,'Bắt đầu: mỗi lượt chọn phần tử nhỏ nhất của phần chưa sắp xếp.');
 for(let i=0;i<n-1;i++){let m=i;
  P(a,`Lượt ${i+1}: tìm phần tử nhỏ nhất từ vị trí ${i}.`,{[i]:'piv'});
  for(let j=i+1;j<n;j++){
   P(a,`So sánh ${a[j]} với min hiện tại là ${a[m]}.`,{[m]:'piv',[j]:'cmp'});
   if(a[j]<a[m]){m=j;P(a,`${a[m]} nhỏ hơn nên trở thành min mới.`,{[m]:'piv'})}
  }
  if(m!==i){sw(a,i,m);P(a,`Đổi chỗ để đưa ${a[i]} về vị trí ${i}.`,{[i]:'swp',[m]:'swp'})}
  ok(i);P(a,`Vị trí ${i} đã có giá trị đúng.`);
 }
 fin(a)}

function insertion(a){const n=a.length;ok(0);P(a,'Coi phần tử đầu tiên là phần đã sắp xếp.');
 for(let i=1;i<n;i++){
  P(a,`Lấy ${a[i]} để chèn vào phần đã sắp xếp.`,{[i]:'piv'});
  let j=i;
  while(j>0){
   P(a,`So sánh ${a[j-1]} với ${a[j]}.`,{[j-1]:'cmp',[j]:'cmp'});
   if(a[j-1]>a[j]){sw(a,j-1,j);P(a,`${a[j]} lớn hơn nên dịch sang phải.`,{[j-1]:'swp',[j]:'swp'});j--}
   else{P(a,`${a[j]} đã đúng chỗ, dừng chèn.`,{[j]:'piv'});break}
  }
  ok(i);P(a,`Phần đầu mảng đến vị trí ${i} đã được sắp xếp.`);
 }
 fin(a)}

function quick(a){
 const qs=(lo,hi)=>{
  if(lo>hi)return;
  if(lo===hi){ok(lo);P(a,`Đoạn chỉ có 1 phần tử (${a[lo]}) nên đã đúng vị trí.`,{},{rng:[lo,hi]});return}
  const p=a[hi];let i=lo;
  P(a,`Đoạn [${lo}..${hi}]: chọn phần tử cuối ${p} làm pivot.`,{[hi]:'piv'},{rng:[lo,hi]});
  for(let j=lo;j<hi;j++){
   P(a,`So sánh ${a[j]} với pivot ${p}.`,{[hi]:'piv',[j]:'cmp'},{rng:[lo,hi],tags:{[i]:'i',[j]:'j'}});
   if(a[j]<p){
    if(i!==j){sw(a,i,j);P(a,`${a[i]} < ${p}: đổi chỗ vào nhóm nhỏ hơn pivot.`,{[hi]:'piv',[i]:'swp',[j]:'swp'},{rng:[lo,hi]})}
    i++;
   }
  }
  sw(a,i,hi);ok(i);
  P(a,`Đặt pivot ${p} vào vị trí ${i}. Bên trái nhỏ hơn, bên phải lớn hơn.`,{[i]:'piv'},{rng:[lo,hi]});
  qs(lo,i-1);qs(i+1,hi);
 };
 P(a,'Bắt đầu: chia mảng quanh pivot rồi xử lý đệ quy hai phía.');
 qs(0,a.length-1);fin(a)}

function merge(a){
 const ms=(lo,hi)=>{
  if(lo>=hi)return;
  const mid=(lo+hi)>>1;ms(lo,mid);ms(mid+1,hi);
  const L=a.slice(lo,mid+1),Rr=a.slice(mid+1,hi+1);let i=0,j=0,k=lo;
  const ex=cmp=>({rng:[lo,hi],ex:[
   {t:'Nửa trái',cells:L.map((v,x)=>({t:v,c:x<i?'dim':(cmp&&x===i?'cmp':'')}))},
   {t:'Nửa phải',cells:Rr.map((v,x)=>({t:v,c:x<j?'dim':(cmp&&x===j?'cmp':'')}))}]});
  P(a,`Trộn đoạn [${lo}..${hi}] từ hai nửa đã sắp xếp.`,{},ex(false));
  const put=v=>{a[k]=v;k++;P(a,`Ghi ${v} vào vị trí ${k-1}.`,{[k-1]:'swp'},ex(false))};
  while(i<L.length&&j<Rr.length){
   P(a,`So sánh ${L[i]} (trái) và ${Rr[j]} (phải): lấy số nhỏ hơn.`,{[k]:'cmp'},ex(true));
   if(L[i]<=Rr[j]){const v=L[i];i++;put(v)}else{const v=Rr[j];j++;put(v)}
  }
  while(i<L.length){const v=L[i];i++;put(v)}
  while(j<Rr.length){const v=Rr[j];j++;put(v)}
 };
 P(a,'Bắt đầu: chia đôi mảng liên tục, rồi trộn các nửa đã sắp xếp.');
 ms(0,a.length-1);fin(a)}

function counting(a){
 const n=a.length,mx=Math.max(...a),c=Array(mx+1).fill(0);
 const ex=h=>({ex:[{t:'Mảng đếm count (chỉ số = giá trị)',cells:c.map((v,x)=>({l:x,t:v,c:x===h?'swp':''}))}]});
 P(a,`Giá trị lớn nhất là ${mx}: tạo mảng count gồm ${mx+1} ô, đều bằng 0.`,{},ex(-1));
 for(let i=0;i<n;i++){c[a[i]]++;P(a,`Đọc ${a[i]}: count[${a[i]}] tăng lên ${c[a[i]]}.`,{[i]:'cmp'},ex(a[i]))}
 let k=0;
 for(let v=0;v<=mx;v++)while(c[v]>0){
  a[k]=v;c[v]--;P(a,`Ghi ${v} vào vị trí ${k}, count[${v}] còn ${c[v]}.`,{[k]:'swp'},ex(v));ok(k);k++;
 }
 fin(a)}

function radix(a){
 const n=a.length,mx=Math.max(...a);
 P(a,'Bắt đầu: sắp xếp theo từng chữ số, từ hàng đơn vị trở lên.');
 for(let e=1;Math.floor(mx/e)>0;e*=10){
  const nm=e===1?'hàng đơn vị':e===10?'hàng chục':e===100?'hàng trăm':'hàng '+e;
  const B=Array.from({length:10},()=>[]);
  const ex=(d,y)=>({ex:B.map((b,x)=>({t:'Xô '+x,cells:b.map((v,q)=>({t:v,c:x===d&&q===(y===undefined?b.length-1:y)?'swp':''}))}))});
  P(a,`Xét ${nm}: chuẩn bị 10 xô (0 đến 9).`,{},ex(-1));
  for(let i=0;i<n;i++){const d=Math.floor(a[i]/e)%10;B[d].push(a[i]);P(a,`${a[i]} có ${nm} là ${d}: bỏ vào xô ${d}.`,{[i]:'cmp'},ex(d))}
  let k=0;
  for(let d=0;d<10;d++)for(let y=0;y<B[d].length;y++){a[k]=B[d][y];P(a,`Lấy ${a[k]} từ xô ${d} xếp lại vào vị trí ${k}.`,{[k]:'swp'},ex(d,y));k++}
  P(a,`Xong ${nm}: ${a.join(', ')}.`);
 }
 fin(a)}

function linear(a){
 P(a,`Tìm ${T} bằng cách duyệt từ đầu mảng.`);
 for(let i=0;i<a.length;i++){
  P(a,`So sánh a[${i}] = ${a[i]} với ${T}.`,{[i]:'cmp'});
  if(a[i]===T){P(a,`a[${i}] = ${T}: tìm thấy tại vị trí ${i}.`,{[i]:'fnd'});return}
  base[i]='miss';
 }
 P(a,`Đã duyệt hết mảng: không có ${T}.`)}

function binary(a){
 let lo=0,hi=a.length-1;
 P(a,`Tìm ${T} trong mảng đã sắp xếp bằng cách chia đôi phạm vi tìm.`);
 while(lo<=hi){
  const m=(lo+hi)>>1,tg={};
  const add=(i,t)=>{tg[i]=tg[i]?tg[i]+'/'+t:t};add(lo,'lo');add(hi,'hi');add(m,'mid');
  P(a,`lo = ${lo}, hi = ${hi}, mid = ${m}. So sánh a[${m}] = ${a[m]} với ${T}.`,{[m]:'cmp'},{rng:[lo,hi],tags:tg});
  if(a[m]===T){P(a,`a[${m}] = ${T}: tìm thấy tại vị trí ${m}.`,{[m]:'fnd'},{tags:tg});return}
  if(a[m]<T){
   P(a,`${a[m]} < ${T}: loại bỏ nửa trái, lo = ${m+1}.`,{[m]:'cmp'},{rng:[lo,hi],tags:tg});
   for(let i=lo;i<=m;i++)base[i]='miss';lo=m+1;
  }else{
   P(a,`${a[m]} > ${T}: loại bỏ nửa phải, hi = ${m-1}.`,{[m]:'cmp'},{rng:[lo,hi],tags:tg});
   for(let i=m;i<=hi;i++)base[i]='miss';hi=m-1;
  }
 }
 P(a,`lo > hi: không có ${T} trong mảng.`)}

const ALG={
 bubble:{n:'Bubble Sort',f:bubble,d:'So sánh từng cặp phần tử kề nhau và đổi chỗ nếu sai thứ tự. Sau mỗi lượt, phần tử lớn nhất nổi về cuối mảng.',w:'O(n²)',b:'O(n)',s:'O(1)'},
 selection:{n:'Selection Sort',f:selection,d:'Mỗi lượt tìm phần tử nhỏ nhất trong phần chưa sắp xếp rồi đưa nó về đầu phần đó.',w:'O(n²)',b:'O(n²)',s:'O(1)'},
 insertion:{n:'Insertion Sort',f:insertion,d:'Lấy lần lượt từng phần tử và chèn vào đúng chỗ trong phần đầu mảng đã được sắp xếp.',w:'O(n²)',b:'O(n)',s:'O(1)'},
 quick:{n:'Quick Sort',f:quick,d:'Chọn một pivot, chia mảng thành nhóm nhỏ hơn và lớn hơn pivot, rồi sắp xếp đệ quy từng nhóm.',w:'O(n²)',b:'O(n log n)',s:'O(log n)'},
 counting:{n:'Counting Sort',f:counting,d:'Đếm số lần xuất hiện của mỗi giá trị rồi ghi lại mảng theo thứ tự giá trị. Phù hợp khi giá trị nằm trong khoảng nhỏ.',w:'O(n + k)',b:'O(n + k)',s:'O(k)'},
 radix:{n:'Radix Sort',f:radix,d:'Sắp xếp theo từng chữ số, từ hàng đơn vị lên hàng lớn nhất. Mỗi lượt phân phối số vào các xô từ 0 đến 9.',w:'O(d · (n + k))',b:'O(d · (n + k))',s:'O(n + k)'},
 merge:{n:'Merge Sort',f:merge,d:'Chia đôi mảng cho đến khi mỗi đoạn có 1 phần tử, rồi trộn hai nửa đã sắp xếp thành một đoạn sắp xếp.',w:'O(n log n)',b:'O(n log n)',s:'O(n)'},
 linear:{n:'Linear Search',f:linear,srch:1,d:'Duyệt từng phần tử từ đầu mảng cho đến khi gặp giá trị cần tìm. Không yêu cầu mảng đã sắp xếp.',w:'O(n)',b:'O(1)',s:'O(1)'},
 binary:{n:'Binary Search',f:binary,srch:1,d:'Chỉ dùng cho mảng đã sắp xếp: so sánh với phần tử giữa rồi loại bỏ một nửa mảng ở mỗi bước.',w:'O(log n)',b:'O(1)',s:'O(1)'}
};
const LEG={cmp:['Đang so sánh','--cmp'],swp:['Đổi chỗ / ghi','--swp'],piv:['Pivot / min / phần tử đang chèn','--piv'],ok:['Đã đúng vị trí / tìm thấy','--ok'],bar:['Chưa xử lý','--bar']};
$('#legend').innerHTML=Object.values(LEG).map(([t,c])=>`<span style="--c:var(${c})">${t}</span>`).join('');
$('#nav').innerHTML=Object.entries(ALG).map(([k,a])=>`<button data-k="${k}">${a.n}</button>`).join('');
$('#nav').onclick=e=>{const k=e.target.dataset.k;if(k)pick(k)};

function gen(){
 const n=+$('#size').value;
 let a=Array.from({length:n},()=>key==='counting'?R(0,9):key==='radix'?R(10,999):R(5,99));
 if(key==='binary')a.sort((x,y)=>x-y);
 arr=a;T=Math.random()<.75?a[R(0,n-1)]:R(5,99);
}
function pick(k){
 key=k;stop();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 const A=ALG[k];
 $('#title').textContent=A.n;$('#desc').textContent=A.d;
 $('#cx').innerHTML=`Xấu nhất: <b>${A.w}</b> · Tốt nhất: <b>${A.b}</b> · Bộ nhớ: <b>${A.s}</b>`;
 $('#tgl').classList.toggle('hide',!A.srch);
 $('#note').textContent=k==='binary'?'Mảng được tự động sắp xếp tăng dần vì Binary Search yêu cầu điều này.':k==='counting'?'Counting Sort dùng giá trị từ 0 đến 30.':k==='radix'?'Radix Sort dùng số nguyên không âm, tối đa 999.':'';
 gen();compute();
}
function compute(){
 stop();S=[];base={};ALG[key].f(arr.slice());trace();
 $('#tgt').value=T;cur=0;
 const st=$('#bars');st.innerHTML='';st.className='bars'+(arr.length>12?' dense':'');
 st.style.setProperty('--n',arr.length);
 MX=Math.max(...arr,1);
 cols=arr.map(()=>{const c=document.createElement('div');c.className='col';c.innerHTML='<span class="v"></span><div class="bar"></div>';st.appendChild(c);return c});
 $('#pos').max=S.length-1;
 render();
}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function trace(){
 S[0].ids=S[0].a.map((_,i)=>i);
 for(let t=1;t<S.length;t++){
  const o=S[t-1],s=S[t],n=s.a.length,used=Array(n).fill(false),ids=Array(n).fill(-1);
  for(let j=0;j<n;j++)if(o.a[j]===s.a[j]){ids[j]=o.ids[j];used[j]=true}
  for(let j=0;j<n;j++){if(ids[j]>=0)continue;
   let b=-1;for(let i=0;i<n;i++)if(!used[i]&&o.a[i]===s.a[j]&&(b<0||Math.abs(i-j)<Math.abs(b-j)))b=i;
   if(b>=0){ids[j]=o.ids[b];used[b]=true}}
  const left=[];for(let i=0;i<n;i++)if(!used[i])left.push(o.ids[i]);
  for(let j=0;j<n;j++)if(ids[j]<0)ids[j]=left.shift();
  s.ids=ids;
 }
}
function render(){
 const s=S[cur],pos=[];s.ids.forEach((id,p)=>pos[id]=p);
 const sp=1150-$('#spd').value*100,d=playing?Math.max(80,Math.min(420,sp*.8)):280;
 $('#bars').style.setProperty('--dur',d+'ms');
 cols.forEach((c,id)=>{
  const p=pos[id],cl=s.cls[p]||'';
  const out=s.rng&&(p<s.rng[0]||p>s.rng[1])&&cl!=='ok';
  const moved=c._p!==undefined&&c._p!==p;
  c.className='col '+cl+(out?' fade':'');
  c.style.setProperty('--p',p);
  c.style.zIndex=moved?2:1;
  c.firstChild.textContent=s.a[p];
  c.lastChild.style.height=Math.max(s.a[p]/MX,.04)*86+'%';
  if(moved&&!RM)c.animate([{transform:'translateY(0)'},{transform:'translateY(-16px)'},{transform:'translateY(0)'}],{duration:d,easing:'ease-in-out'});
  c._p=p;
 });
 $('#idx').innerHTML=arr.map((_,i)=>`<span>${i}${s.tags&&s.tags[i]?' '+s.tags[i]:''}</span>`).join('');
 $('#ex').innerHTML=(s.ex||[]).map(g=>`<div class="grp"><b>${g.t}</b><div class="cells">${g.cells.map(x=>`<span class="cell ${x.c||''}">${x.l!==undefined?`<i>${x.l}</i>`:''}${x.t}</span>`).join('')}</div></div>`).join('');
 $('#msg').textContent=s.msg;
 $('#cnt').textContent=`Bước ${cur+1}/${S.length}`;
 $('#pos').value=cur;
}
function stop(){playing=false;clearTimeout(timer);$('#play').textContent='Chạy'}
function tick(){
 if(!playing)return;
 if(cur<S.length-1){cur++;render();timer=setTimeout(tick,1150-$('#spd').value*100)}else stop();
}
function toggle(){
 if(playing){stop();return}
 if(cur>=S.length-1){cur=0;render()}
 playing=true;$('#play').textContent='Tạm dừng';timer=setTimeout(tick,300);
}
const go=n=>{stop();cur=Math.max(0,Math.min(S.length-1,n));render()};
$('#play').onclick=toggle;
$('#next').onclick=()=>go(cur+1);
$('#prev').onclick=()=>go(cur-1);
$('#first').onclick=()=>go(0);
$('#pos').oninput=e=>go(+e.target.value);
$('#gen').onclick=()=>{gen();compute()};
$('#size').oninput=e=>{$('#sizev').textContent=e.target.value;gen();compute()};
$('#tgt').onchange=e=>{const v=parseInt(e.target.value,10);if(!isNaN(v)){T=v;compute()}};
$('#apply').onclick=()=>{
 const a=$('#custom').value.split(/[\s,;]+/).filter(Boolean).map(Number);
 const lim=key==='counting'?30:999;
 if(a.length<2||a.length>20||a.some(x=>!Number.isInteger(x)||x<0||x>lim)){
  $('#note').textContent=`Hãy nhập 2 đến 20 số nguyên không âm, mỗi số tối đa ${lim}.`;return;
 }
 if(key==='binary')a.sort((x,y)=>x-y);
 arr=a;if(ALG[key].srch)T=a[R(0,a.length-1)];
 compute();
};
document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;
 if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
});
pick('bubble');
</script>
</body>
</html>
